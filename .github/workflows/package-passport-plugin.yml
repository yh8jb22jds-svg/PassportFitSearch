name: Package Passport Fit Finder
on:
  push:
    branches: [fix/automatic-barrel-sizing]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l wordpress-plugin/passport-fit-search/passport-fit-search.php
      - name: Check JavaScript syntax
        run: node --check wordpress-plugin/passport-fit-search/homepage-fit-search.js
      - name: Run firearm search regression
        run: php tests/search-regression.php
      - name: Check fit coverage
        run: php tests/size-coverage-audit.php > /tmp/size-coverage.txt
      - name: Create installable WordPress plugin ZIP
        run: bash scripts/package-plugin.sh
      - name: Verify bundled database
        run: |
          unzip -t passport-fit-search-install.zip
          unzip -l passport-fit-search-install.zip | grep 'data/customer-confirmed/2026-11-04_firearm_master_customer_confirmed_r1.csv'
      - uses: actions/upload-artifact@v4
        with:
          name: passport-fit-search-install
          path: passport-fit-search-install.zip
          retention-days: 30
