name: Search regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l wordpress-plugin/passport-fit-search/passport-fit-search.php
      - name: Test repository imports and search
        run: php tests/search-regression.php
      - name: Audit size coverage
        run: php tests/size-coverage-audit.php > /tmp/passport-size-audit.csv && head -n 5 /tmp/passport-size-audit.csv && echo 'First 15 missing records:' && sed -n '6,20p' /tmp/passport-size-audit.csv
