name: Search regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l wordpress-plugin/passport-fit-search/passport-fit-search.php
      - name: Test repository imports and search
        run: php tests/search-regression.php
      - name: Audit size coverage
        run: php tests/size-coverage-audit.php > passport-size-audit.csv && head -n 10 passport-size-audit.csv && echo 'First 15 missing records:' && grep 'UNRESOLVED_SAMPLE:' passport-size-audit.csv | head -n 65
      - name: Save complete size audit for correction work
        uses: actions/upload-artifact@v4
        with:
          name: passport-size-coverage-audit
          path: passport-size-audit.csv
